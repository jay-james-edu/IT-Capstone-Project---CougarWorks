services:
  # MongoDB Database
  mongo:
    image: mongo:7
    container_name: cougarworks-mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-cougarworks_app}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS:-change-this-mongo-password}
      - MONGO_INITDB_DATABASE=${MONGO_DB_NAME:-CougarWorks}
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok' --quiet"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Flask Application
  app:
    build: .
    container_name: cougarworks-app
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key}
      - FLASK_ENV=${FLASK_ENV:-production}
      - DEBUG=${DEBUG:-False}
      - APP_NAME=${APP_NAME:-CougarWorks}
      - SCHOOL_NAME=${SCHOOL_NAME:-Columbus State University}
      - SCHOOL_URL=${SCHOOL_URL:-https://www.columbusstate.edu}
      - MONGO_URI=mongodb://${MONGO_USER:-cougarworks_app}:${MONGO_PASS:-change-this-mongo-password}@cougarworks-mongo:27017/${MONGO_DB_NAME:-CougarWorks}?authSource=admin
      - PYTHONUNBUFFERED=1
    volumes:
      - ./src:/app
    ports:
      - "5000:5000"
    networks:
      - backend
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:

networks:
  backend:
    driver: bridge
