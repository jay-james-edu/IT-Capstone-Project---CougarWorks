<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Advisor - CougarWorks</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <h2>CougarWorks</h2>
                <span>Admin Portal</span>
            </div>
            <nav class="sidebar-nav">
                <a href="{{ url_for('system.dashboard') }}">
                    <span class="icon">&gt;</span> Dashboard
                </a>
                <a href="{{ url_for('admin.admin_add_student') }}">
                    <span class="icon">&gt;</span> Add Student
                </a>
                <a href="{{ url_for('admin.admin_add_advisor') }}" class="active">
                    <span class="icon">&gt;</span> Add Advisor
                </a>
            </nav>
            <a href="{{ url_for('auth.logout') }}" class="logout-btn">
                <span class="icon">X</span> Logout
            </a>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <h1>Add New Advisor</h1>
            </div>

            <div class="info-box">
                <form method="POST" action="{{ url_for('admin.admin_add_advisor') }}" class="profile-form">
                    <h3 class="section-title">Personal Information</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Advisor ID *</label>
                            <input type="text" name="advisorId" required>
                        </div>
                        <div class="form-group">
                            <label>First Name *</label>
                            <input type="text" name="firstName" required>
                        </div>
                        <div class="form-group">
                            <label>Last Name *</label>
                            <input type="text" name="lastName" required>
                        </div>
                        <div class="form-group">
                            <label>Email *</label>
                            <input type="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label>Password *</label>
                            <input type="password" name="password" required>
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" name="phone">
                        </div>
                    </div>

                    <h3 class="section-title mt-3">Work Information</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Department *</label>
                            <input type="text" name="department" required>
                        </div>
                        <div class="form-group">
                            <label>Office *</label>
                            <input type="text" name="office" required>
                        </div>
                    </div>

                    <h3 class="section-title mt-3">Office Hours</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Monday</label>
                            <input type="text" name="hours_monday" placeholder="e.g., 9:00 AM - 5:00 PM">
                        </div>
                        <div class="form-group">
                            <label>Tuesday</label>
                            <input type="text" name="hours_tuesday">
                        </div>
                        <div class="form-group">
                            <label>Wednesday</label>
                            <input type="text" name="hours_wednesday">
                        </div>
                        <div class="form-group">
                            <label>Thursday</label>
                            <input type="text" name="hours_thursday">
                        </div>
                        <div class="form-group">
                            <label>Friday</label>
                            <input type="text" name="hours_friday">
                        </div>
                    </div>

                    <div class="mt-3">
                        <button type="submit" class="btn-primary">Add Advisor</button>
                        <a href="{{ url_for('system.dashboard') }}" class="btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
