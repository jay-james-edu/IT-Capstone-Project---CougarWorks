<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student - CougarWorks</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <h2>CougarWorks</h2>
                <span>Admin Portal</span>
            </div>
            <nav class="sidebar-nav">
                <a href="{{ url_for('system.dashboard') }}">
                    <span class="icon">&gt;</span> Dashboard
                </a>
                <a href="{{ url_for('admin.admin_add_student') }}" class="active">
                    <span class="icon">&gt;</span> Add Student
                </a>
                <a href="{{ url_for('admin.admin_add_advisor') }}">
                    <span class="icon">&gt;</span> Add Advisor
                </a>
            </nav>
            <a href="{{ url_for('auth.logout') }}" class="logout-btn">
                <span class="icon">X</span> Logout
            </a>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <h1>Add New Student</h1>
            </div>

            <div class="info-box">
                <form method="POST" action="{{ url_for('admin.admin_add_student') }}" class="profile-form">
                    <h3 class="section-title">Personal Information</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Student ID *</label>
                            <input type="text" name="studentId" required>
                        </div>
                        <div class="form-group">
                            <label>First Name *</label>
                            <input type="text" name="firstName" required>
                        </div>
                        <div class="form-group">
                            <label>Last Name *</label>
                            <input type="text" name="lastName" required>
                        </div>
                        <div class="form-group">
                            <label>Email *</label>
                            <input type="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label>Password *</label>
                            <input type="password" name="password" required>
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" name="phone">
                        </div>
                    </div>

                    <h3 class="section-title mt-3">Address</h3>
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label>Street</label>
                            <input type="text" name="address_street">
                        </div>
                        <div class="form-group">
                            <label>City</label>
                            <input type="text" name="address_city">
                        </div>
                        <div class="form-group">
                            <label>State</label>
                            <input type="text" name="address_state">
                        </div>
                        <div class="form-group">
                            <label>ZIP</label>
                            <input type="text" name="address_zip">
                        </div>
                    </div>

                    <h3 class="section-title mt-3">Academic Information</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Major *</label>
                            <select name="major" required>
                                <option value="Computer Science">Computer Science</option>
                                <option value="Information Technology">Information Technology</option>
                                <option value="Cybersecurity">Cybersecurity</option>
                                <option value="Management Information Systems">Management Information Systems</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Catalog Year *</label>
                            <input type="text" name="catalogYear" value="2024-2025" required>
                        </div>
                        <div class="form-group">
                            <label>Enrollment Status *</label>
                            <select name="enrollmentStatus" required>
                                <option value="Active">Active</option>
                                <option value="Inactive">Inactive</option>
                                <option value="Provisional">Provisional</option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-3">
                        <button type="submit" class="btn-primary">Add Student</button>
                        <a href="{{ url_for('system.dashboard') }}" class="btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
