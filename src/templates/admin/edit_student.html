<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Student - CougarWorks</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <h2>CougarWorks (Admin)</h2>
            <a href="{{ url_for('system.dashboard') }}">Dashboard</a>
            <a href="{{ url_for('admin.admin_add_student') }}">Add Student</a>
            <a href="{{ url_for('admin.admin_add_advisor') }}">Add Advisor</a>
            <a href="{{ url_for('auth.logout') }}" style="margin-top:auto; background:#ef4444;">Logout</a>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <h1>Edit Student: {{ student.personalInfo.firstName }} {{ student.personalInfo.lastName }}</h1>
            </div>

            <div class="info-box">
                <form method="POST" action="{{ url_for('admin.admin_edit_student', student_id=student.studentId) }}" class="profile-form">
                    <h3 class="section-title">Personal Information</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Student ID</label>
                            <input type="text" value="{{ student.studentId }}" disabled>
                        </div>
                        <div class="form-group">
                            <label>First Name *</label>
                            <input type="text" name="firstName" value="{{ student.personalInfo.firstName }}" required>
                        </div>
                        <div class="form-group">
                            <label>Last Name *</label>
                            <input type="text" name="lastName" value="{{ student.personalInfo.lastName }}" required>
                        </div>
                        <div class="form-group">
                            <label>Email *</label>
                            <input type="email" name="email" value="{{ student.email }}" required>
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" name="phone" value="{{ student.personalInfo.phone or '' }}">
                        </div>
                    </div>

                    <h3 class="section-title mt-3">Academic Information</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Major *</label>
                            <select name="major" required>
                                {% for major in majors %}
                                <option value="{{ major }}" {% if student.academicInfo.major == major %}selected{% endif %}>
                                    {{ major }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Catalog Year *</label>
                            <input type="text" name="catalogYear" value="{{ student.academicInfo.catalogYear }}" required>
                        </div>
                        <div class="form-group">
                            <label>Enrollment Status *</label>
                            <select name="enrollmentStatus" required>
                                <option value="Active" {% if student.academicInfo.enrollmentStatus == 'Active' %}selected{% endif %}>Active</option>
                                <option value="Inactive" {% if student.academicInfo.enrollmentStatus == 'Inactive' %}selected{% endif %}>Inactive</option>
                                <option value="Provisional" {% if student.academicInfo.enrollmentStatus == 'Provisional' %}selected{% endif %}>Provisional</option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-3">
                        <button type="submit" class="btn-primary">Save Changes</button>
                        <a href="{{ url_for('system.dashboard') }}" class="btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
