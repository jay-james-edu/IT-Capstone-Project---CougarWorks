<!DOCTYPE html>
<html>
<head>
    <title>Schedule Meeting - CougarWorks</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <h2>CougarWorks</h2>
                <span>Advisor Portal</span>
            </div>
            <nav class="sidebar-nav">
                <a href="{{ url_for('system.dashboard') }}"><span class="icon">&gt;</span> My Advisees</a>
                <a href="{{ url_for('advisors.advisor_meetings') }}"><span class="icon">&gt;</span> Meetings</a>
            </nav>
            <a href="{{ url_for('auth.logout') }}" class="logout-btn">
                <span class="icon">X</span> Logout
            </a>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <h1>Schedule New Meeting</h1>
            </div>

            <div class="info-box">
                <form method="POST" action="{{ url_for('advisors.schedule_meeting') }}" class="profile-form">
                    <h3 class="section-title">Meeting Details</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Student *</label>
                            <select name="studentId" required>
                                {% for student in advisees %}
                                <option value="{{ student.studentId }}">
                                    {{ student.personalInfo.firstName }} {{ student.personalInfo.lastName }} ({{ student.studentId }})
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Title *</label>
                            <input type="text" name="title" required>
                        </div>
                        <div class="form-group full-width">
                            <label>Description</label>
                            <textarea name="description" rows="3"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Date *</label>
                            <input type="date" name="scheduledDate" required>
                        </div>
                        <div class="form-group">
                            <label>Start Time *</label>
                            <input type="time" name="startTime" required>
                        </div>
                        <div class="form-group">
                            <label>End Time *</label>
                            <input type="time" name="endTime" required>
                        </div>
                        <div class="form-group">
                            <label>Location *</label>
                            <input type="text" name="location" required>
                        </div>
                    </div>

                    <div class="mt-3">
                        <button type="submit" class="btn-primary">Schedule Meeting</button>
                        <a href="{{ url_for('advisors.advisor_meetings') }}" class="btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
