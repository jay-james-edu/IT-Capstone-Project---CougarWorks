<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Remaining Courses - CougarWorks</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <h2>CougarWorks</h2>
                <span>Columbus State University</span>
            </div>
            <nav class="sidebar-nav">
                <a href="{{ url_for('system.student_dashboard') }}">
                    <span class="icon">&gt;</span> Dashboard
                </a>
                <a href="{{ url_for('system.degree_progress') }}">
                    <span class="icon">&gt;</span> Degree Progress
                </a>
                <a href="{{ url_for('system.remaining_courses') }}" class="active">
                    <span class="icon">&gt;</span> Remaining Courses
                </a>
                <a href="{{ url_for('system.gpa_standing') }}">
                    <span class="icon">&gt;</span> GPA Standing
                </a>
                <a href="{{ url_for('system.profile') }}">
                    <span class="icon">&gt;</span> Profile
                </a>
            </nav>
            <a href="{{ url_for('system.logout') }}" class="logout-btn">
                <span class="icon">X</span> Logout
            </a>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <div>
                    <h1>Remaining Courses</h1>
                    <p>Courses required for graduation</p>
                </div>
                <div class="user-badge">
                    <strong>{{ student_id }}</strong>
                </div>
            </div>

            <div id="remaining-container">
                <div style="padding: 20px; text-align: center; color: var(--text-secondary);">Loading remaining courses...</div>
            </div>
        </main>
    </div>

    <script>
        async function loadRemaining() {
            try {
                const res = await fetch('/api/students/{{ student_id }}/degree-progress-summary');
                const data = await res.json();
                const container = document.getElementById('remaining-container');
                container.innerHTML = '';

                let totalRemaining = 0;

                if (data.categoryProgress) {
                    data.categoryProgress.forEach(cat => {
                        const remainingCourses = (cat.courses || []).filter(c => c.status === 'Remaining');

                        if (remainingCourses.length > 0) {
                            totalRemaining += remainingCourses.length;

                            let html = `
                                <div class="audit-section">
                                    <div class="audit-header">
                                        <h3>${cat.name}</h3>
                                        <span class="audit-status incomplete">${remainingCourses.length} NEEDED</span>
                                    </div>
                                    <div class="audit-content">
                            `;

                            remainingCourses.forEach(course => {
                                html += `
                                    <div class="course-item" style="border-left: 4px solid var(--status-warning-text);">
                                        <span class="course-code">${course.code}</span>
                                        <span class="course-title">${course.name}</span>
                                        <span class="status-badge status-remaining">Needed</span>
                                        <span class="course-credits">${course.credits} Cr</span>
                                    </div>
                                `;
                            });

                            html += `</div></div>`;
                            container.innerHTML += html;
                        }
                    });
                }

                if (totalRemaining === 0) {
                    container.innerHTML = `
                        <div class="info-box" style="text-align: center; padding: 50px;">
                            <div style="font-size: 48px; margin-bottom: 15px;">🎉</div>
                            <div style="font-size: 20px; color: var(--status-good-text); font-weight: 600;">You are on track!</div>
                            <p style="color: var(--text-secondary); margin-top: 10px;">No remaining courses listed.</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error("Error fetching remaining courses:", error);
                document.getElementById('remaining-container').innerHTML = `
                    <div class="info-box" style="text-align: center; color: var(--status-error-text);">
                        Error loading data. Please try again.
                    </div>
                `;
            }
        }

        loadRemaining();
    </script>
</body>
</html>
